<!-- Floating Chatbot Widget -->
<div class="chatbot-widget" id="chatbotWidget">
    <!-- Floating Chat Button -->
    <button class="floating-chat-btn" id="floatingChatBtn" onclick="toggleChatWidget()">
        <i class="fas fa-comments" id="chatIcon"></i>
        <i class="fas fa-times" id="closeIcon" style="display: none;"></i>
    </button>

    <!-- Chat Modal -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-container">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0">
                            <i class="fas fa-robot me-2"></i>
                            AI Assistant
                        </h6>
                        <small class="opacity-75">Online • Instant replies</small>
                    </div>
                    <button class="btn btn-sm btn-outline-light" onclick="toggleChatWidget()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages widget-messages" id="widgetChatMessages">
                <!-- Welcome message will be inserted here -->
            </div>

            <!-- Chat Input -->
            <div class="chat-input-container">
                <div class="input-group">
                    <input 
                        type="text" 
                        class="form-control chat-input" 
                        id="widgetMessageInput" 
                        placeholder="Type your message..." 
                        onkeydown="handleWidgetKeyDown(event)"
                    >
                    <button class="send-btn" id="widgetSendBtn" onclick="sendWidgetMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Widget Footer -->
            <div class="widget-footer">
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-muted">Powered by Student ERP AI</small>
                    <button class="btn btn-sm btn-link text-muted" onclick="openFullChat()">
                        <i class="fas fa-expand me-1"></i>Full Chat
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Chatbot Widget Styles */
.chatbot-widget {
    position: fixed;
    bottom: 0;
    right: 0;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

.floating-chat-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: white;
    border: none;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
}

.floating-chat-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgba(13, 110, 253, 0.4);
}

.floating-chat-btn.active {
    background: #dc3545;
}

.chat-modal {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    display: none;
    overflow: hidden;
    transition: all 0.3s ease;
}

.chat-modal.show {
    display: block;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-container {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.chat-header {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: white;
    padding: 1rem;
}

.chat-header h6 {
    font-weight: 600;
}

.widget-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    background: #f8f9fa;
    max-height: 320px;
}

.widget-message {
    margin-bottom: 1rem;
    animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.widget-message.user {
    text-align: right;
}

.widget-message-bubble {
    display: inline-block;
    max-width: 80%;
    padding: 0.75rem;
    border-radius: 18px;
    font-size: 0.875rem;
    line-height: 1.4;
    word-wrap: break-word;
}

.widget-bot-message {
    background: white;
    border: 1px solid #dee2e6;
    color: #333;
    border-bottom-left-radius: 8px;
}

.widget-user-message {
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: white;
    border-bottom-right-radius: 8px;
}

.widget-quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    margin-top: 0.5rem;
}

.widget-quick-reply-btn {
    padding: 0.25rem 0.5rem;
    background: #e9ecef;
    border: 1px solid #dee2e6;
    border-radius: 12px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #495057;
}

.widget-quick-reply-btn:hover {
    background: #0d6efd;
    color: white;
    border-color: #0d6efd;
}

.chat-input-container {
    padding: 0.75rem;
    background: white;
    border-top: 1px solid #dee2e6;
}

.widget-footer {
    padding: 0.5rem 0.75rem;
    background: #f8f9fa;
    border-top: 1px solid #dee2e6;
    font-size: 0.75rem;
}

.widget-typing-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 18px;
    border-bottom-left-radius: 8px;
    margin-bottom: 1rem;
    max-width: 80%;
}

.widget-typing-dots {
    display: flex;
    gap: 0.2rem;

.widget-typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6c757d;
    animation: typing 1.4s infinite ease-in-out;

.widget-typing-dot:nth-child(1) { animation-delay: -0.32s; }
.widget-typing-dot:nth-child(2) { animation-delay: -0.16s; }

/* Mobile responsiveness */
@media (max-width: 768px) {
    .chat-modal {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
    }
    
    .floating-chat-btn {
        bottom: 15px;
        right: 15px;
        width: 55px;
        height: 55px;
    }
}

/* Hide scrollbar for webkit browsers */
.widget-messages::-webkit-scrollbar {
    width: 4px;
}

.widget-messages::-webkit-scrollbar-track {
    background: transparent;
}

.widget-messages::-webkit-scrollbar-thumb {
    background: #dee2e6;
    border-radius: 4px;
}

.widget-messages::-webkit-scrollbar-thumb:hover {
    background: #adb5bd;
}
</style>

<script>
// Chatbot Widget JavaScript
let widgetSessionId = null;
let widgetIsTyping = false;
let widgetCurrentUser = null;
let isChatOpen = false;

// Initialize widget when page loads
document.addEventListener('DOMContentLoaded', function() {
    initializeChatWidget();
});

// Initialize chat widget
function initializeChatWidget() {
    // Get current user if available
    if (typeof getUserData === 'function') {
        widgetCurrentUser = getUserData();
    }
    
    // Add notification badge if there are new messages
    checkForNotifications();
}

// Toggle chat widget
function toggleChatWidget() {
    const chatModal = document.getElementById('chatModal');
    const floatingBtn = document.getElementById('floatingChatBtn');
    const chatIcon = document.getElementById('chatIcon');
    const closeIcon = document.getElementById('closeIcon');
    
    if (isChatOpen) {
        // Close chat
        chatModal.classList.remove('show');
        chatModal.style.display = 'none';
        floatingBtn.classList.remove('active');
        chatIcon.style.display = 'block';
        closeIcon.style.display = 'none';
        isChatOpen = false;
    } else {
        // Open chat
        chatModal.classList.add('show');
        chatModal.style.display = 'block';
        floatingBtn.classList.add('active');
        chatIcon.style.display = 'none';
        closeIcon.style.display = 'block';
        isChatOpen = true;
        
        // Start conversation if not already started
        if (!widgetSessionId) {
            startWidgetConversation();
        }
        
        // Focus input
        setTimeout(() => {
            document.getElementById('widgetMessageInput').focus();
        }, 300);
    }
}

// Start widget conversation
async function startWidgetConversation() {
    try {
        const response = await fetch('/api/chatbot/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                userId: widgetCurrentUser?.id,
                userType: widgetCurrentUser?.role || 'guest'
            })
        });

        const result = await response.json();

        if (result.success) {
            widgetSessionId = result.sessionId;
            addWidgetBotMessage(result.message, result.quickReplies);
        } else {
            addWidgetBotMessage("Hello! I'm your AI assistant. How can I help you today?", [
                "Admission Info",
                "Fee Inquiry", 
                "Hostel Info",
                "Library Services"
            ]);
        }
    } catch (error) {
        console.error('Error starting widget conversation:', error);
        addWidgetBotMessage("Hello! I'm your AI assistant. How can I help you today?");
    }
}

// Send widget message
async function sendWidgetMessage() {
    const input = document.getElementById('widgetMessageInput');
    const message = input.value.trim();

    if (!message || widgetIsTyping) return;

    if (!widgetSessionId) {
        await startWidgetConversation();
        if (!widgetSessionId) return;
    }

    // Add user message
    addWidgetUserMessage(message);
    input.value = '';

    // Show typing indicator
    showWidgetTypingIndicator();

    try {
        const response = await fetch('/api/chatbot/message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                sessionId: widgetSessionId,
                message: message,
                userId: widgetCurrentUser?.id
            })
        });

        const result = await response.json();
        hideWidgetTypingIndicator();

        if (result.success) {
            addWidgetBotMessage(result.message, result.quickReplies, result.buttons);
        } else {
            addWidgetBotMessage("I'm sorry, I couldn't process that. Please try again.");
        }
    } catch (error) {
        hideWidgetTypingIndicator();
        console.error('Error sending widget message:', error);
        addWidgetBotMessage("I'm sorry, there was an error. Please try again.");
    }
}

// Handle widget keyboard events
function handleWidgetKeyDown(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        sendWidgetMessage();
    }
}

// Add widget user message
function addWidgetUserMessage(message) {
    const messagesContainer = document.getElementById('widgetChatMessages');
    
    const messageElement = document.createElement('div');
    messageElement.className = 'widget-message user';
    messageElement.innerHTML = `
        <div class="widget-message-bubble widget-user-message">
            ${escapeHtml(message)}
        </div>
    `;

    messagesContainer.appendChild(messageElement);
    scrollWidgetToBottom();
}

// Add widget bot message
function addWidgetBotMessage(message, quickReplies = [], buttons = []) {
    const messagesContainer = document.getElementById('widgetChatMessages');
    
    let quickRepliesHtml = '';
    if (quickReplies && quickReplies.length > 0) {
        quickRepliesHtml = `
            <div class="widget-quick-replies">
                ${quickReplies.slice(0, 3).map(reply => `
                    <button class="widget-quick-reply-btn" onclick="sendWidgetSuggestion('${escapeHtml(reply)}')">${escapeHtml(reply)}</button>
                `).join('')}
            </div>
        `;
    }
    
    const messageElement = document.createElement('div');
    messageElement.className = 'widget-message bot';
    messageElement.innerHTML = `
        <div class="widget-message-bubble widget-bot-message">
            ${formatWidgetMessage(message)}
        </div>
        ${quickRepliesHtml}
    `;

    messagesContainer.appendChild(messageElement);
    scrollWidgetToBottom();
}

// Show widget typing indicator
function showWidgetTypingIndicator() {
    if (widgetIsTyping) return;
    
    widgetIsTyping = true;
    const messagesContainer = document.getElementById('widgetChatMessages');
    
    const typingElement = document.createElement('div');
    typingElement.className = 'widget-message bot';
    typingElement.id = 'widgetTypingIndicator';
    typingElement.innerHTML = `
        <div class="widget-typing-indicator">
            <div class="widget-typing-dots">
                <div class="widget-typing-dot"></div>
                <div class="widget-typing-dot"></div>
                <div class="widget-typing-dot"></div>
            </div>
            <span style="font-size: 0.75rem; color: #6c757d;">typing...</span>
        </div>
    `;

    messagesContainer.appendChild(typingElement);
    scrollWidgetToBottom();
}

// Hide widget typing indicator
function hideWidgetTypingIndicator() {
    widgetIsTyping = false;
    const typingIndicator = document.getElementById('widgetTypingIndicator');
    if (typingIndicator) {
        typingIndicator.remove();
    }
}

// Send widget suggestion
function sendWidgetSuggestion(suggestion) {
    document.getElementById('widgetMessageInput').value = suggestion;
    sendWidgetMessage();
}

// Scroll widget to bottom
function scrollWidgetToBottom() {
    const messagesContainer = document.getElementById('widgetChatMessages');
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// Format widget message
function formatWidgetMessage(message) {
    return escapeHtml(message).replace(/\n/g, '<br>');
}

// Open full chat page
function openFullChat() {
    window.open('/frontend/chatbot/', '_blank');
}

// Check for notifications (placeholder function)
function checkForNotifications() {
    // This could be enhanced to show a notification badge
    // when there are unread messages or important updates
}

// Utility function for HTML escaping (if not already defined)
if (typeof escapeHtml !== 'function') {
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
}
</script>
