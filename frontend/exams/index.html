<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Exams | Student ERP</title>
    
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    
    <style>
        .exam-card {
            border-left: 4px solid #3b82f6;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .exam-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .exam-card.upcoming { border-left-color: #f59e0b; }
        .exam-card.completed { border-left-color: #10b981; }
        .exam-card.ongoing { border-left-color: #ef4444; }
        .result-grade {
            font-size: 3rem;
            font-weight: bold;
        }
        .grade-A { color: #10b981; }
        .grade-B { color: #3b82f6; }
        .grade-C { color: #f59e0b; }
        .grade-D { color: #ef4444; }
        .grade-F { color: #dc2626; }
        .hall-ticket-preview {
            border: 2px dashed #dee2e6;
            background: #f8f9fa;
        }
        .countdown {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-mortarboard-fill me-2"></i>Student ERP
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/attendance">Attendance</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/exams">Exams</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fees">Fees</a></li>
                    <li class="nav-item"><a class="nav-link" href="/library">Library</a></li>
                </ul>
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span id="userName">Student</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/profile">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-4" id="examTabs">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#schedule">
                    <i class="bi bi-calendar-event me-2"></i>Exam Schedule
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#results">
                    <i class="bi bi-trophy me-2"></i>Results
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#halltickets">
                    <i class="bi bi-card-heading me-2"></i>Hall Tickets
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#gradecards">
                    <i class="bi bi-file-earmark-text me-2"></i>Grade Cards
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Exam Schedule Tab -->
            <div class="tab-pane fade show active" id="schedule">
                <!-- Next Exam Countdown -->
                <div class="card mb-4 bg-gradient text-white" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <div class="card-body text-center py-4">
                        <h5 class="mb-2">Next Exam</h5>
                        <h3 class="mb-3" id="nextExamName">Loading...</h3>
                        <div class="countdown mb-3">
                            <span id="countdown">--:--:--:--</span>
                        </div>
                        <small id="nextExamDetails"></small>
                    </div>
                </div>

                <!-- Filters -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <select class="form-select" id="examTypeFilter" onchange="loadExamSchedule()">
                            <option value="">All Exam Types</option>
                            <option value="mid-term">Mid-Term</option>
                            <option value="end-term">End-Term</option>
                            <option value="internal">Internal</option>
                            <option value="practical">Practical</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="semesterFilter" onchange="loadExamSchedule()">
                            <option value="">Current Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                </div>

                <!-- Exam Cards -->
                <div id="examSchedule" class="row">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- Results Tab -->
            <div class="tab-pane fade" id="results">
                <!-- CGPA Overview -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h6 class="text-muted">Current CGPA</h6>
                                <h2 class="text-primary" id="currentCGPA">0.00</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h6 class="text-muted">Latest SGPA</h6>
                                <h2 class="text-success" id="latestSGPA">0.00</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h6 class="text-muted">Credits Earned</h6>
                                <h2 class="text-info" id="creditsEarned">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h6 class="text-muted">Backlogs</h6>
                                <h2 class="text-danger" id="backlogs">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Exam Results</h5>
                            <select class="form-select form-select-sm w-auto" id="resultSemesterFilter" onchange="loadResults()">
                                <option value="">All Semesters</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Subject</th>
                                        <th>Subject Code</th>
                                        <th>Credits</th>
                                        <th>Internal</th>
                                        <th>External</th>
                                        <th>Total</th>
                                        <th>Grade</th>
                                        <th>Points</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsTable">
                                    <!-- Loaded dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Hall Tickets Tab -->
            <div class="tab-pane fade" id="halltickets">
                <div class="row" id="hallTicketsList">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- Grade Cards Tab -->
            <div class="tab-pane fade" id="gradecards">
                <div class="row" id="gradeCardsList">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <!-- Hall Ticket Modal -->
    <div class="modal fade" id="hallTicketModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Hall Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="hallTicketContent" class="hall-ticket-preview p-4">
                        <!-- Hall ticket content loaded here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="downloadHallTicket()">
                        <i class="bi bi-download me-2"></i>Download PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('token');
        let nextExamDate = null;
        let currentExamId = null;

        if (!token) {
            window.location.href = '/auth/login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadExamSchedule();
            loadResults();
            loadHallTickets();
            loadGradeCards();
            startCountdown();
        });

        async function loadExamSchedule() {
            try {
                const type = document.getElementById('examTypeFilter').value;
                const semester = document.getElementById('semesterFilter').value;
                
                const res = await fetch(`${API_BASE}/exams/schedule?type=${type}&semester=${semester}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const container = document.getElementById('examSchedule');
                
                if (!data.schedule || data.schedule.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-calendar-x display-1 text-muted"></i>
                            <p class="mt-3 text-muted">No exams scheduled</p>
                        </div>
                    `;
                    return;
                }

                // Find next upcoming exam
                const now = new Date();
                const upcomingExams = data.schedule.filter(e => new Date(e.date) > now);
                if (upcomingExams.length > 0) {
                    const nextExam = upcomingExams[0];
                    document.getElementById('nextExamName').textContent = nextExam.subject;
                    document.getElementById('nextExamDetails').textContent = 
                        `${new Date(nextExam.date).toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} | ${nextExam.startTime} | ${nextExam.venue}`;
                    nextExamDate = new Date(nextExam.date + 'T' + nextExam.startTime);
                }

                container.innerHTML = data.schedule.map(exam => {
                    const examDate = new Date(exam.date);
                    const isPast = examDate < now;
                    const isToday = examDate.toDateString() === now.toDateString();
                    
                    return `
                        <div class="col-md-6 col-lg-4 mb-3">
                            <div class="card exam-card ${isPast ? 'completed' : isToday ? 'ongoing' : 'upcoming'}">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge ${isPast ? 'bg-success' : isToday ? 'bg-danger' : 'bg-warning'}">
                                            ${isPast ? 'Completed' : isToday ? 'Today' : 'Upcoming'}
                                        </span>
                                        <span class="badge bg-secondary">${exam.examType}</span>
                                    </div>
                                    <h5 class="card-title">${exam.subject}</h5>
                                    <p class="card-text text-muted small">${exam.subjectCode}</p>
                                    <hr>
                                    <div class="row small">
                                        <div class="col-6">
                                            <i class="bi bi-calendar me-1"></i>
                                            ${examDate.toLocaleDateString('en-IN')}
                                        </div>
                                        <div class="col-6">
                                            <i class="bi bi-clock me-1"></i>
                                            ${exam.startTime}
                                        </div>
                                        <div class="col-6 mt-2">
                                            <i class="bi bi-geo-alt me-1"></i>
                                            ${exam.venue}
                                        </div>
                                        <div class="col-6 mt-2">
                                            <i class="bi bi-file-text me-1"></i>
                                            ${exam.maxMarks} Marks
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading exam schedule:', error);
            }
        }

        async function loadResults() {
            try {
                const semester = document.getElementById('resultSemesterFilter').value;
                const res = await fetch(`${API_BASE}/exams/my-results?semester=${semester}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.summary) {
                    document.getElementById('currentCGPA').textContent = (data.summary.cgpa || 0).toFixed(2);
                    document.getElementById('latestSGPA').textContent = (data.summary.latestSgpa || 0).toFixed(2);
                    document.getElementById('creditsEarned').textContent = data.summary.creditsEarned || 0;
                    document.getElementById('backlogs').textContent = data.summary.backlogs || 0;
                }

                const tbody = document.getElementById('resultsTable');
                if (!data.results || data.results.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="8" class="text-center py-4 text-muted">No results available</td></tr>
                    `;
                    return;
                }

                tbody.innerHTML = data.results.map(result => `
                    <tr>
                        <td>${result.subject}</td>
                        <td>${result.subjectCode}</td>
                        <td>${result.credits}</td>
                        <td>${result.internalMarks || '-'}</td>
                        <td>${result.externalMarks || '-'}</td>
                        <td><strong>${result.totalMarks}</strong></td>
                        <td><span class="badge grade-${result.grade} bg-light">${result.grade}</span></td>
                        <td>${result.gradePoints}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading results:', error);
            }
        }

        async function loadHallTickets() {
            try {
                const res = await fetch(`${API_BASE}/exams/hall-tickets`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const container = document.getElementById('hallTicketsList');
                if (!data.hallTickets || data.hallTickets.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-card-heading display-1 text-muted"></i>
                            <p class="mt-3 text-muted">No hall tickets available</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.hallTickets.map(ticket => `
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <i class="bi bi-card-heading display-4 text-primary mb-3"></i>
                                <h5>${ticket.examName}</h5>
                                <p class="text-muted">${ticket.semester} - ${ticket.academicYear}</p>
                                <button class="btn btn-outline-primary" onclick="viewHallTicket('${ticket.id}')">
                                    <i class="bi bi-eye me-2"></i>View
                                </button>
                                <button class="btn btn-primary ms-2" onclick="downloadHallTicketDirect('${ticket.id}')">
                                    <i class="bi bi-download me-2"></i>Download
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading hall tickets:', error);
            }
        }

        async function loadGradeCards() {
            try {
                const res = await fetch(`${API_BASE}/exams/grade-cards`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const container = document.getElementById('gradeCardsList');
                if (!data.gradeCards || data.gradeCards.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-file-earmark-text display-1 text-muted"></i>
                            <p class="mt-3 text-muted">No grade cards available</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.gradeCards.map(card => `
                    <div class="col-md-3 mb-3">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <div class="result-grade grade-${card.grade}">${card.grade}</div>
                                <h6>Semester ${card.semester}</h6>
                                <p class="text-muted mb-2">SGPA: ${card.sgpa.toFixed(2)}</p>
                                <small class="text-muted">${card.academicYear}</small>
                            </div>
                            <div class="card-footer bg-transparent">
                                <button class="btn btn-sm btn-outline-primary w-100" onclick="downloadGradeCard(${card.semester})">
                                    <i class="bi bi-download me-1"></i>Download
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading grade cards:', error);
            }
        }

        async function viewHallTicket(examId) {
            currentExamId = examId;
            try {
                const res = await fetch(`${API_BASE}/exams/${examId}/hall-ticket/preview`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                document.getElementById('hallTicketContent').innerHTML = `
                    <div class="text-center mb-4">
                        <h3>HALL TICKET</h3>
                        <h5>${data.examName}</h5>
                    </div>
                    <div class="row">
                        <div class="col-9">
                            <table class="table table-borderless">
                                <tr><td>Name:</td><td><strong>${data.studentName}</strong></td></tr>
                                <tr><td>Roll Number:</td><td>${data.rollNumber}</td></tr>
                                <tr><td>Department:</td><td>${data.department}</td></tr>
                                <tr><td>Semester:</td><td>${data.semester}</td></tr>
                            </table>
                        </div>
                        <div class="col-3 text-center">
                            <div class="border p-2">
                                <small class="text-muted">Photo</small>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <h6>Exam Schedule:</h6>
                    <table class="table table-sm">
                        <thead>
                            <tr><th>Subject</th><th>Date</th><th>Time</th><th>Venue</th></tr>
                        </thead>
                        <tbody>
                            ${data.subjects.map(s => `
                                <tr>
                                    <td>${s.name}</td>
                                    <td>${s.date}</td>
                                    <td>${s.time}</td>
                                    <td>${s.venue}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                new bootstrap.Modal(document.getElementById('hallTicketModal')).show();
            } catch (error) {
                console.error('Error loading hall ticket:', error);
            }
        }

        async function downloadHallTicket() {
            if (currentExamId) {
                await downloadHallTicketDirect(currentExamId);
            }
        }

        async function downloadHallTicketDirect(examId) {
            window.open(`${API_BASE}/exams/${examId}/hall-ticket?token=${token}`, '_blank');
        }

        async function downloadGradeCard(semester) {
            window.open(`${API_BASE}/exams/grade-card/${semester}?token=${token}`, '_blank');
        }

        function startCountdown() {
            setInterval(() => {
                if (!nextExamDate) return;
                
                const now = new Date();
                const diff = nextExamDate - now;
                
                if (diff <= 0) {
                    document.getElementById('countdown').textContent = 'Exam Started!';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('countdown').textContent = 
                    `${days.toString().padStart(2, '0')}d : ${hours.toString().padStart(2, '0')}h : ${minutes.toString().padStart(2, '0')}m : ${seconds.toString().padStart(2, '0')}s`;
            }, 1000);
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/auth/login.html';
        }
    </script>
</body>
</html>
