<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Padho Rajasthan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* Rajasthani Culture Header Styling */
    .navbar-brand {
      font-family: 'Georgia', 'Times New Roman', serif !important;
      font-size: 1.8rem !important;
      font-weight: bold !important;
      color: #ff6b35 !important;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3) !important;
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
    }
    
    .navbar-brand:hover {
      color: #ffd700 !important;
      transform: scale(1.02) !important;
      transition: all 0.3s ease !important;
    }
    
    /* Rajasthani decorative elements */
    .navbar-brand::before {
      content: "" !important;
      font-size: 1.2rem !important;
      margin-right: 5px !important;
    }
    
    .navbar-brand::after {
      content: "🌟" !important;
      font-size: 0.9rem !important;
      margin-left: 5px !important;
      animation: sparkle 2s infinite !important;
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    
    /* Rajasthani text styling with Hindi touch */
    .rajasthani-text {
      background: linear-gradient(45deg, #ff6b35, #ffd700, #ff4757) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      font-weight: 900 !important;
      letter-spacing: 1px !important;
    }
    
    /* Logo enhancement for Rajasthani theme */
    .navbar-brand img {
      border: 2px solid #ffd700 !important;
      border-radius: 50% !important;
      padding: 2px !important;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5) !important;
      transition: all 0.3s ease !important;
    }
    
    .navbar-brand:hover img {
      transform: rotate(5deg) !important;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.8) !important;
    }
    
    .login-container {
      max-width: 400px;
      margin: 0 auto;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }
    
    .auth-options {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    
    .auth-option {
      flex: 1;
      text-align: center;
      padding: 1rem 0;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 2px solid transparent;
    }
    
    .auth-option.active {
      border-bottom-color: var(--primary-color);
      color: var(--primary-color);
    }
    
    .login-bg {
      background-image: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), url('../assets/campus.jpg');
      background-size: cover;
      background-position: center;
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-logo img {
      max-width: 120px;
      margin-bottom: 1rem;
    }
    
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-light);
    }
    
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .or-divider::before {
      margin-right: .5rem;
    }
    
    .or-divider::after {
      margin-left: .5rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/logo.png" alt="Rajasthan Govt Logo" height="40">
        <span class="rajasthani-text">पढ़ो राजस्थान</span>
        <small style="display: block; font-size: 0.7rem; color: #ffd700; margin-top: -5px;">Padho Rajasthan</small>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-home"></i> Home</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="login-bg">
    <div class="container">
      <div class="login-container">
        <div class="login-logo">
          <img src="../assets/logo.png" alt="Rajasthan Govt Logo">
          <h4>ERP System Login</h4>
        </div>
        
        <div class="auth-options">
          <div class="auth-option active" id="login-tab" onclick="switchTab('login')">Login</div>
          <div class="auth-option" id="register-tab" onclick="switchTab('register')">Register</div>
        </div>
        
        <div id="login-form">
          <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" class="form-control" id="email" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control" id="password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
              <a href="#" class="float-end">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            
            <div class="or-divider">or</div>
            
            <button type="button" class="btn btn-outline-secondary w-100 mb-3" onclick="microsoftLogin()">
              <i class="fab fa-microsoft me-2"></i> Login with Microsoft 365
            </button>
          </form>
        </div>
        
        <div id="register-form" style="display: none;">
          <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label">Email address</label>
              <input type="email" class="form-control" id="regEmail" required>
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="regPassword" required>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="agreeTerms" required>
              <label class="form-check-label" for="agreeTerms">
                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
              </label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle between login and register forms
    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('login-tab').classList.add('active');
        document.getElementById('register-tab').classList.remove('active');
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('register-tab').classList.add('active');
        document.getElementById('login-tab').classList.remove('active');
      }
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Handle login form submission
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // Show loading state
      const submitBtn = event.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store authentication data
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user_data', JSON.stringify(data.user));

          if (rememberMe) {
            localStorage.setItem('remember_me', 'true');
          }

          // Show success message
          showAlert('Login successful! Redirecting...', 'success');

          // Redirect based on user role
          setTimeout(() => {
            switch (data.user.role) {
              case 'admin':
              case 'super_admin':
                window.location.href = '../dashboard/index.html';
                break;
              case 'staff':
                window.location.href = '../dashboard/index.html';
                break;
              case 'student':
                window.location.href = '../index.html';
                break;
              default:
                window.location.href = '../index.html';
            }
          }, 1500);
        } else {
          showAlert(data.message || 'Login failed', 'error');
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('Network error. Please try again.', 'error');
      } finally {
        // Reset button state
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }

      return false;
    }

    // Handle register form submission
    async function handleRegister(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Client-side validation
      if (password !== confirmPassword) {
        showAlert('Passwords do not match!', 'error');
        return false;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters long!', 'error');
        return false;
      }

      // Show loading state
      const submitBtn = event.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Registering...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email,
            password,
            name: fullName,
            role: 'student' // Default role for self-registration
          })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! Please login with your credentials.', 'success');
          switchTab('login');

          // Clear form
          event.target.reset();
        } else {
          showAlert(data.message || 'Registration failed', 'error');
        }
      } catch (error) {
        console.error('Registration error:', error);
        showAlert('Network error. Please try again.', 'error');
      } finally {
        // Reset button state
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }

      return false;
    }

    // Microsoft 365 login
    async function microsoftLogin() {
      try {
        // In production, redirect to Microsoft OAuth
        // For now, show placeholder
        showAlert('Microsoft 365 login will be available in production deployment.', 'info');

        // Placeholder for Microsoft OAuth flow
        /*
        const microsoftAuthUrl = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?` +
          `client_id=${CLIENT_ID}&` +
          `response_type=code&` +
          `redirect_uri=${encodeURIComponent(REDIRECT_URI)}&` +
          `scope=${encodeURIComponent('https://graph.microsoft.com/User.Read openid profile email')}&` +
          `state=${generateState()}`;

        window.location.href = microsoftAuthUrl;
        */
      } catch (error) {
        console.error('Microsoft login error:', error);
        showAlert('Microsoft login failed. Please try again.', 'error');
      }
    }

    // Utility function to show alerts
    function showAlert(message, type = 'info') {
      // Remove existing alerts
      const existingAlerts = document.querySelectorAll('.alert');
      existingAlerts.forEach(alert => alert.remove());

      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type === 'error' ? 'danger' : type} alert-dismissible fade show`;
      alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;

      const container = document.querySelector('.login-container');
      container.insertBefore(alertDiv, container.firstChild);

      // Auto-dismiss after 5 seconds
      setTimeout(() => {
        if (alertDiv.parentNode) {
          alertDiv.remove();
        }
      }, 5000);
    }

    // Check if user is already logged in
    function checkAuthStatus() {
      const token = localStorage.getItem('auth_token');
      const userData = localStorage.getItem('user_data');

      if (token && userData) {
        // Verify token is still valid
        fetch('/api/auth/profile', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        })
        .then(response => {
          if (response.ok) {
            // Token is valid, redirect to appropriate page
            const user = JSON.parse(userData);
            switch (user.role) {
              case 'admin':
              case 'super_admin':
              case 'staff':
                window.location.href = '../dashboard/index.html';
                break;
              default:
                window.location.href = '../index.html';
            }
          } else {
            // Token is invalid, clear storage
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
          }
        })
        .catch(error => {
          console.error('Auth check error:', error);
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_data');
        });
      }
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', function() {
      checkAuthStatus();
    });
  </script>
</body>
</html>
