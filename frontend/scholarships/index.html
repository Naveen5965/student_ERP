<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Scholarships | Student ERP</title>
    
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    
    <style>
        .scholarship-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .scholarship-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .amount-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.5rem;
            padding: 1rem;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .deadline-warning { border-left: 4px solid #f59e0b; }
        .deadline-urgent { border-left: 4px solid #ef4444; }
        .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-approved { background-color: #d1fae5; color: #065f46; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
        .status-disbursed { background-color: #dbeafe; color: #1e40af; }
        .timeline-item {
            position: relative;
            padding-left: 2rem;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e5e7eb;
        }
        .timeline-item::after {
            content: '';
            position: absolute;
            left: -5px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3b82f6;
        }
        .eligibility-check {
            list-style: none;
            padding: 0;
        }
        .eligibility-check li::before {
            content: '✓';
            color: #10b981;
            font-weight: bold;
            margin-right: 0.5rem;
        }
        .eligibility-check li.failed::before {
            content: '✗';
            color: #ef4444;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-mortarboard-fill me-2"></i>Student ERP
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fees">Fees</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/scholarships">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="/documents">Documents</a></li>
                </ul>
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span id="userName">Student</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/profile">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <!-- Overview Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h6 class="card-title opacity-75">Available Scholarships</h6>
                        <h2 id="availableCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-dark">
                    <div class="card-body">
                        <h6 class="card-title opacity-75">My Applications</h6>
                        <h2 id="myApplicationsCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h6 class="card-title opacity-75">Approved</h6>
                        <h2 id="approvedCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h6 class="card-title opacity-75">Total Received</h6>
                        <h2>₹<span id="totalReceived">0</span></h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-4" id="scholarshipTabs">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#available">
                    <i class="bi bi-gift me-2"></i>Available Scholarships
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#myApplications">
                    <i class="bi bi-file-earmark-check me-2"></i>My Applications
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#history">
                    <i class="bi bi-clock-history me-2"></i>History
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Available Scholarships Tab -->
            <div class="tab-pane fade show active" id="available">
                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="categoryFilter" onchange="loadScholarships()">
                                    <option value="">All Categories</option>
                                    <option value="merit">Merit Based</option>
                                    <option value="need">Need Based</option>
                                    <option value="sports">Sports</option>
                                    <option value="minority">Minority</option>
                                    <option value="government">Government</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Amount Range</label>
                                <select class="form-select" id="amountFilter" onchange="loadScholarships()">
                                    <option value="">All Amounts</option>
                                    <option value="0-25000">Up to ₹25,000</option>
                                    <option value="25000-50000">₹25,000 - ₹50,000</option>
                                    <option value="50000-100000">₹50,000 - ₹1,00,000</option>
                                    <option value="100000+">Above ₹1,00,000</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Deadline</label>
                                <select class="form-select" id="deadlineFilter" onchange="loadScholarships()">
                                    <option value="">All Deadlines</option>
                                    <option value="7">Within 7 days</option>
                                    <option value="30">Within 30 days</option>
                                    <option value="90">Within 90 days</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Eligibility</label>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="eligibleOnly" onchange="loadScholarships()">
                                    <label class="form-check-label" for="eligibleOnly">Show eligible only</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Scholarships List -->
                <div id="scholarshipsList" class="row">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- My Applications Tab -->
            <div class="tab-pane fade" id="myApplications">
                <div id="applicationsList">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- History Tab -->
            <div class="tab-pane fade" id="history">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Scholarship</th>
                                        <th>Amount</th>
                                        <th>Applied On</th>
                                        <th>Status</th>
                                        <th>Disbursed On</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTable">
                                    <!-- Loaded dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Apply Modal -->
    <div class="modal fade" id="applyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Apply for Scholarship</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <h4 id="applyScholarshipName"></h4>
                        <p class="text-muted" id="applyScholarshipDesc"></p>
                    </div>

                    <div class="card mb-4">
                        <div class="card-header">
                            <h6 class="mb-0">Eligibility Check</h6>
                        </div>
                        <div class="card-body">
                            <ul class="eligibility-check" id="eligibilityList">
                                <!-- Loaded dynamically -->
                            </ul>
                        </div>
                    </div>

                    <form id="applicationForm">
                        <input type="hidden" id="scholarshipId">
                        
                        <div class="mb-3">
                            <label class="form-label">Statement of Purpose</label>
                            <textarea class="form-control" id="statementOfPurpose" rows="4" 
                                placeholder="Explain why you deserve this scholarship..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Required Documents</label>
                            <div id="requiredDocuments">
                                <!-- Loaded dynamically -->
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Bank Account Details</label>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <input type="text" class="form-control" id="bankName" placeholder="Bank Name" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control" id="accountNumber" placeholder="Account Number" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control" id="ifscCode" placeholder="IFSC Code" required>
                                </div>
                                <div class="col-md-6">
                                    <input type="text" class="form-control" id="accountHolder" placeholder="Account Holder Name" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="declaration" required>
                            <label class="form-check-label" for="declaration">
                                I declare that all the information provided is true and accurate
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitApplication()">
                        <i class="bi bi-send me-2"></i>Submit Application
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Details Modal -->
    <div class="modal fade" id="applicationDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Application Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="applicationDetailsContent">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('token');
        let applyModal, detailsModal;

        if (!token) {
            window.location.href = '/auth/login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyModal = new bootstrap.Modal(document.getElementById('applyModal'));
            detailsModal = new bootstrap.Modal(document.getElementById('applicationDetailsModal'));
            
            loadScholarships();
            loadMyApplications();
            loadHistory();
            loadStats();
        });

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/scholarships/my-applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const applications = data.applications || [];
                document.getElementById('myApplicationsCount').textContent = applications.length;
                document.getElementById('approvedCount').textContent = 
                    applications.filter(a => a.status === 'approved' || a.status === 'disbursed').length;
                document.getElementById('totalReceived').textContent = 
                    applications.filter(a => a.status === 'disbursed')
                        .reduce((sum, a) => sum + (a.amount || 0), 0).toLocaleString('en-IN');
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadScholarships() {
            try {
                const category = document.getElementById('categoryFilter').value;
                const eligibleOnly = document.getElementById('eligibleOnly').checked;
                
                const res = await fetch(`${API_BASE}/scholarships/available?category=${category}&eligibleOnly=${eligibleOnly}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                document.getElementById('availableCount').textContent = data.scholarships?.length || 0;

                const container = document.getElementById('scholarshipsList');
                if (!data.scholarships || data.scholarships.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-search display-1 text-muted"></i>
                            <p class="mt-3 text-muted">No scholarships found matching your criteria</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.scholarships.map(scholarship => {
                    const deadline = new Date(scholarship.deadline);
                    const daysLeft = Math.ceil((deadline - new Date()) / (1000 * 60 * 60 * 24));
                    const urgencyClass = daysLeft <= 7 ? 'deadline-urgent' : daysLeft <= 30 ? 'deadline-warning' : '';
                    
                    return `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="card scholarship-card h-100 ${urgencyClass}">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-3">
                                        <span class="badge bg-secondary">${scholarship.category}</span>
                                        ${scholarship.isEligible ? '<span class="badge bg-success">Eligible</span>' : ''}
                                    </div>
                                    <h5 class="card-title">${scholarship.name}</h5>
                                    <p class="card-text text-muted small">${scholarship.description.substring(0, 100)}...</p>
                                    <hr>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div>
                                            <small class="text-muted">Amount</small>
                                            <h4 class="mb-0 text-primary">₹${scholarship.amount.toLocaleString('en-IN')}</h4>
                                        </div>
                                        <div class="text-end">
                                            <small class="text-muted">Deadline</small>
                                            <p class="mb-0 ${daysLeft <= 7 ? 'text-danger' : daysLeft <= 30 ? 'text-warning' : ''}">
                                                ${daysLeft > 0 ? `${daysLeft} days left` : 'Expired'}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer bg-transparent">
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-outline-primary" onclick="viewScholarship('${scholarship.id}')">
                                            View Details
                                        </button>
                                        ${scholarship.isEligible && !scholarship.hasApplied && daysLeft > 0 ? `
                                            <button class="btn btn-primary" onclick="openApplyModal('${scholarship.id}')">
                                                Apply Now
                                            </button>
                                        ` : scholarship.hasApplied ? `
                                            <button class="btn btn-success" disabled>Already Applied</button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading scholarships:', error);
            }
        }

        async function loadMyApplications() {
            try {
                const res = await fetch(`${API_BASE}/scholarships/my-applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const container = document.getElementById('applicationsList');
                if (!data.applications || data.applications.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-inbox display-1 text-muted"></i>
                            <p class="mt-3 text-muted">You haven't applied for any scholarships yet</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.applications.map(app => `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-6">
                                    <h5 class="mb-1">${app.scholarshipName}</h5>
                                    <p class="text-muted mb-0">Applied: ${new Date(app.appliedOn).toLocaleDateString('en-IN')}</p>
                                </div>
                                <div class="col-md-2 text-center">
                                    <h5 class="mb-0">₹${app.amount.toLocaleString('en-IN')}</h5>
                                </div>
                                <div class="col-md-2 text-center">
                                    <span class="badge status-${app.status} py-2 px-3">${app.status.toUpperCase()}</span>
                                </div>
                                <div class="col-md-2 text-end">
                                    <button class="btn btn-outline-primary btn-sm" onclick="viewApplication('${app.id}')">
                                        <i class="bi bi-eye me-1"></i>View
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading applications:', error);
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API_BASE}/scholarships/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const tbody = document.getElementById('historyTable');
                if (!data.history || data.history.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="5" class="text-center py-4 text-muted">No history available</td></tr>
                    `;
                    return;
                }

                tbody.innerHTML = data.history.map(item => `
                    <tr>
                        <td>${item.scholarshipName}</td>
                        <td>₹${item.amount.toLocaleString('en-IN')}</td>
                        <td>${new Date(item.appliedOn).toLocaleDateString('en-IN')}</td>
                        <td><span class="badge status-${item.status}">${item.status}</span></td>
                        <td>${item.disbursedOn ? new Date(item.disbursedOn).toLocaleDateString('en-IN') : '-'}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        async function openApplyModal(scholarshipId) {
            try {
                const res = await fetch(`${API_BASE}/scholarships/${scholarshipId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const scholarship = await res.json();

                document.getElementById('scholarshipId').value = scholarshipId;
                document.getElementById('applyScholarshipName').textContent = scholarship.name;
                document.getElementById('applyScholarshipDesc').textContent = scholarship.description;

                // Load eligibility criteria
                document.getElementById('eligibilityList').innerHTML = scholarship.eligibilityCriteria.map(c => `
                    <li class="${c.met ? '' : 'failed'}">${c.criterion}</li>
                `).join('');

                // Load required documents
                document.getElementById('requiredDocuments').innerHTML = scholarship.requiredDocuments.map(doc => `
                    <div class="form-check">
                        <input class="form-check-input doc-check" type="checkbox" value="${doc.type}" id="doc-${doc.type}">
                        <label class="form-check-label" for="doc-${doc.type}">
                            ${doc.name} ${doc.uploaded ? '<span class="badge bg-success ms-2">Uploaded</span>' : '<span class="badge bg-warning ms-2">Pending</span>'}
                        </label>
                    </div>
                `).join('');

                applyModal.show();
            } catch (error) {
                console.error('Error loading scholarship:', error);
            }
        }

        async function submitApplication() {
            const scholarshipId = document.getElementById('scholarshipId').value;
            const form = document.getElementById('applicationForm');
            
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const data = {
                statementOfPurpose: document.getElementById('statementOfPurpose').value,
                bankDetails: {
                    bankName: document.getElementById('bankName').value,
                    accountNumber: document.getElementById('accountNumber').value,
                    ifscCode: document.getElementById('ifscCode').value,
                    accountHolder: document.getElementById('accountHolder').value
                }
            };

            try {
                const res = await fetch(`${API_BASE}/scholarships/${scholarshipId}/apply`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (res.ok) {
                    applyModal.hide();
                    alert('Application submitted successfully!');
                    loadScholarships();
                    loadMyApplications();
                    loadStats();
                } else {
                    alert(result.message || 'Failed to submit application');
                }
            } catch (error) {
                console.error('Error submitting application:', error);
                alert('Error submitting application');
            }
        }

        async function viewApplication(applicationId) {
            try {
                const res = await fetch(`${API_BASE}/scholarships/applications/${applicationId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const app = await res.json();

                document.getElementById('applicationDetailsContent').innerHTML = `
                    <div class="row">
                        <div class="col-md-8">
                            <h4>${app.scholarshipName}</h4>
                            <p class="text-muted">${app.description}</p>
                        </div>
                        <div class="col-md-4 text-end">
                            <h3 class="text-primary">₹${app.amount.toLocaleString('en-IN')}</h3>
                            <span class="badge status-${app.status} py-2 px-3">${app.status.toUpperCase()}</span>
                        </div>
                    </div>
                    <hr>
                    <h6>Application Timeline</h6>
                    <div class="timeline mt-3">
                        ${app.timeline.map(item => `
                            <div class="timeline-item mb-3">
                                <strong>${item.status}</strong>
                                <p class="text-muted mb-0 small">${new Date(item.date).toLocaleString('en-IN')}</p>
                                ${item.remarks ? `<p class="mb-0 small">${item.remarks}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    ${app.status === 'rejected' && app.rejectionReason ? `
                        <div class="alert alert-danger mt-3">
                            <strong>Rejection Reason:</strong> ${app.rejectionReason}
                        </div>
                    ` : ''}
                    ${app.status === 'disbursed' ? `
                        <div class="alert alert-success mt-3">
                            <strong>Amount Disbursed:</strong> ₹${app.disbursedAmount.toLocaleString('en-IN')} on ${new Date(app.disbursedOn).toLocaleDateString('en-IN')}
                        </div>
                    ` : ''}
                `;

                detailsModal.show();
            } catch (error) {
                console.error('Error loading application details:', error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/auth/login.html';
        }
    </script>
</body>
</html>
